name: Veille Pokemon 30 ans
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: pokemon-watcher-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Lancer la verification
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_ALL_30: ${{ vars.EMAIL_ALL_30 }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ALL: ${{ vars.NOTIFY_ALL }}
        run: python check_pokemon.py
      - name: Sauvegarder l'etat mis a jour
        run: |
          git config user.name "pokemon-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_products.json watch_status.json
          git diff --quiet --cached && exit 0
          git commit -m "Mise a jour de la veille"
          git pull --rebase -X theirs || true
          git push
